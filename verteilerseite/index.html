<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>GASTRO RADAR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets-landing/style.css">
</head>
<body>

  <main class="landing">

    <header class="landing-header">
      <img src="img-landing/gr-logo.png" alt="GastroRadar" class="logo">
      <p class="claim">Wissen, was in deiner Stadt los ist.</p>
    </header>

    <section class="city-grid">

      <!-- Leipzig (aktiv) -->
      <a href="/leipzig/" class="city-card active">
        <img src="img-landing/leipzig.jpg" alt="Leipzig">
        <span class="city-name">Leipzig</span>
        <span class="city-status">Jetzt verfügbar</span>
      </a>

      <!-- München -->
      <div class="city-card disabled">
        <img src="img-landing/muenchen.webp" alt="München">
        <span class="city-name">München</span>
        <span class="city-status">Coming soon</span>
      </div>

      <!-- Dresden -->
      <div class="city-card disabled">
        <img src="img-landing/dresden.webp" alt="Dresden">
        <span class="city-name">Dresden</span>
        <span class="city-status">Coming soon</span>
      </div>

      <!-- Kiel -->
      <div class="city-card disabled">
        <img src="img-landing/kiel.webp" alt="Kiel">
        <span class="city-name">Kiel</span>
        <span class="city-status">Coming soon</span>
      </div>

    </section>

    <footer class="landing-footer">
      <p>Ein Tool für Gastronomie. Kein Login. Keine Registrierung.</p>
    </footer>

  </main>

</body>
</html>
